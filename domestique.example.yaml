# Domestique app config. Copy to domestique.yaml and edit.
#
# Nothing here is a secret — account ids, labels and group names only. Every
# credential comes from the environment (in a cluster: Vault -> ExternalSecret
# -> envFrom).

# Where the route library lives.
#
# Routes are rows in a database, with the GPX as a blob. The DSN picks the
# engine:
#   a postgres:// URL  -> PostgreSQL, which is what a deployment uses
#   anything else      -> a SQLite file, right for a laptop
source:
  dsn: data/domestique.db
  # dsn: postgres://domestique:PASSWORD@postgres-cluster-rw.postgres-cluster:5432/domestique
  #
  # The DSN carries a password, so in a cluster it comes from the environment
  # rather than this file — DOMESTIQUE_SOURCE_DSN overrides what is written
  # here. See the deployment notes in docs/plan.md.

# Who may use the app, and what they may do.
#
# Three modes, pick one:
#
#   none   no login, and every visitor is an admin. Right for a laptop, wrong
#          for anything reachable by anyone else.
#   proxy  trust a reverse proxy's headers (Remote-User / Remote-Groups /
#          Remote-Name / Remote-Email) — Authelia's forwardAuth, typically.
#   oidc   authenticate riders itself against an OIDC issuer (Auth0,
#          Keycloak, Zitadel, ...). See docs/oidc.md.
#
# mode: proxy's warning, and it is specific to that mode: THE APP MUST NOT BE
# REACHABLE EXCEPT THROUGH THAT PROXY. Anyone who can reach it directly can
# set those headers themselves and be whoever they like. trusted_proxies
# narrows that further; leave it empty only when the service is
# ClusterIP-only. mode: oidc does not have this problem — the app verifies
# signed tokens itself rather than trusting a header — which is why it is the
# mode for a deployment that faces the public directly.
auth:
  mode: none

  # mode: proxy
  # trusted_proxies:
  #   - 10.42.0.0/16          # the cluster's pod CIDR

  # mode: oidc
  # oidc:
  #   issuer: https://your-tenant.example.com/   # discovery does the rest
  #   client_id: domestique
  #   # client_secret comes from DOMESTIQUE_OIDC_CLIENT_SECRET, never this file
  #   redirect_url: https://app.example.com/sso/callback
  #   scopes: [openid, profile, email]
  #   # Which ID-token claim carries group membership. Issuers disagree:
  #   # Authelia sends "groups"; Auth0 needs a custom claim added by an
  #   # Action, namespaced; Google sends none at all — leave this unset and
  #   # every rider falls through to default_role below, which is correct,
  #   # not a bug to work around.
  #   groups_claim: groups
  #
  # mode: oidc also needs DOMESTIQUE_ENCRYPTION_KEY set (generate one with
  # `domestique keygen`) — without it there is nowhere safe to hold the
  # session or the short-lived sign-in state, and /sso/login refuses outright
  # rather than degrade.
  #
  # Roles, mapped from groups. Most privileged match wins. The group names
  # are Authelia's under mode: proxy, or whatever your issuer's groups_claim
  # sends under mode: oidc — the mapping works the same either way.
  #   viewer  read routes, download GPX, see what would be pushed
  #   rider   + upload, import from Komoot, push, edit and delete their own
  #   admin   + edit and delete anyone's routes
  # roles:
  #   admin:
  #     - domestique-admins
  #   rider:
  #     - cyclists
  #   viewer:
  #     - guests
  #
  # Applied to an authenticated rider whose groups match nothing above.
  # Defaults to viewer: read-only is the safe answer for someone the identity
  # provider let in but this app has no opinion about.
  # default_role: viewer
  #
  # Refuse anyone outside this group entirely — with one exception: a group
  # named in `roles` above is itself a way in. The gate is here to stop every
  # account your IdP knows about arriving as a `default_role` viewer, not to
  # make an admin you named explicitly also join a second group before they
  # are let in.
  # required_group: cyclists
  #
  # Where "Sign out" goes. Mode-specific, because who owns the session
  # differs:
  #   mode: proxy  this app holds no session — the proxy does — so only your
  #                identity provider's own address can end one. With
  #                Authelia's portal on a path of the same host that is
  #                /auth/logout; on its own hostname,
  #                https://auth.example.com/logout. Unset hides the button.
  #   mode: oidc   the app ends its own session; nothing to set here — the
  #                frontend calls POST /sso/logout instead.
  # logout_url: /auth/logout

# Import routes from a Komoot account.
#
# Komoot has no public API; this uses the same undocumented endpoints their
# apps do, so expect it to break occasionally.
#
# With this on, each rider signs in to their own Komoot from the web UI and
# imports from their own account. That needs DOMESTIQUE_ENCRYPTION_KEY in the
# environment (`domestique keygen` prints one); without it the sign-in form is
# not offered, because the session would have to be stored unencrypted.
#
# KOMOOT_EMAIL and KOMOOT_PASSWORD still work as one shared account for the
# whole deployment. A rider's own sign-in takes precedence over it. Either way
# the credentials come from the environment — never put them here.
komoot:
  enabled: false
  # Also import rides you have recorded, not just routes you have plotted.
  # include_recorded: false

# Head units are not configured here.
#
# Riders link their own Garmin or Wahoo from the web UI, and the link is stored
# in the database next to the routes. The rider is taken from the Authelia
# session at link time, so there is no second place where somebody's name and
# devices are written down, and no way for the two to disagree.
#
# A route with no `targets` of its own reaches only its own owner's own head
# units. Naming a crew in `targets` shares it with that crew — reachable in
# the app, and pushable to it by a crew ride's own explicit "sync now" — but
# general-purpose push (this button, auto-sync, the CLI) never reaches past
# the route's own owner, no matter what it names in `targets`.

# Backfill elevation for a route that has none of its own worth trusting —
# never queried at all, or (the case this exists for) every point stamped
# with the same 0.00000 placeholder by a route-planning site that never
# touched real terrain data.
#
# Off by default: this and routing below are the only things in this file
# that send a route's own coordinates to a service outside the deployment
# on their own initiative, not because a rider asked to connect an account.
# A regular running route can reveal where someone lives — turning either
# of these on is a decision to make on purpose.
elevation:
  enabled: false
  # Defaults to the public Open-Elevation instance (api.open-elevation.com) —
  # free, no API key, open source. Point this at a self-hosted instance
  # instead if you would rather not depend on the public one.
  # url: https://api.open-elevation.com/api/v1/lookup

# Powers the route builder: snapping manually-placed waypoints to real
# roads, and suggesting round-trip loops for the suggested and AI-native
# builders. Off by default, same reasoning as elevation above.
routing:
  enabled: false
  # Defaults to the public OpenRouteService instance (api.openrouteservice.org)
  # — self-hostable via the openrouteservice/openrouteservice Docker image
  # instead if you would rather not depend on the public one. Either way an
  # API key is required, even for the public instance's free tier — set
  # DOMESTIQUE_ROUTING_API_KEY in the environment, never here.
  # url: https://api.openrouteservice.org
