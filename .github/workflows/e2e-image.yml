name: E2E test image

# Separate from image.yml on purpose: this builds apps/e2e, the Playwright
# suite Argo Rollouts' postPromotionAnalysis runs against a live deploy —
# an internal test tool, not a distributable, so no Docker Hub mirror and
# no build-provenance attestation ceremony, and no reason to rebuild it on
# every unrelated app commit (path-filtered below).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/e2e/**"
      - ".github/workflows/e2e-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wncservices/domestique-e2e
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: apps/e2e
          # amd64 only: this never runs as a long-lived workload, just a
          # short-lived AnalysisRun Job — not worth doubling build time for
          # arm64 the way the app image's own multi-platform build is.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
