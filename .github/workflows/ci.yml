name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with .tool-versions and the .golangci.yml format version.
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  changes:
    # The Go jobs take most of CI's time and a change that only touches the
    # frontend cannot break them, so they are skipped for it. A job skipped by
    # its `if` reports as passed, which keeps the required checks green; a
    # workflow-level paths filter would leave them pending forever instead.
    # Anything outside the UI-only paths below (or a diff that cannot be read)
    # runs everything.
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! changed="$(git diff --name-only "$BASE...$HEAD")" || [ -z "$changed" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Go tests that read a frontend file (rideanalysis checks
          # fitnessMath.ts against the Go formulas) make that file API-relevant.
          mirrored="$( (grep -rhoE '\.\./\.\./\.\./web/[A-Za-z0-9_./-]+' --include='*_test.go' apps/api || true) \
            | sed 's#^\.\./\.\./\.\./#apps/#' | sort -u)"
          api=false
          while IFS= read -r f; do
            if [ -n "$mirrored" ] && printf '%s\n' "$mirrored" | grep -qxF "$f"; then api=true; break; fi
            case "$f" in
              apps/web/*|apps/e2e/*|docs/*|*.md) ;;
              *) api=true; break ;;
            esac
          done <<< "$changed"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "Go jobs needed: $api"

  api:
    # The required check keeps its name; the work is in api-tests below. This
    # job builds, checks formatting, and fails if any test shard did. Skipped
    # (and so passed) when the change is frontend only.
    name: API — build & tests
    runs-on: ubuntu-latest
    needs: [changes, api-tests]
    if: ${{ !cancelled() && needs.changes.outputs.api == 'true' }}
    steps:
      - name: Every test shard passed
        run: |
          if [ "${{ needs.api-tests.result }}" != "success" ]; then
            echo "::error::API test shards: ${{ needs.api-tests.result }}"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go mod download
        working-directory: apps/api
      - run: go build -v ./...
        working-directory: apps/api
      - name: Build without the workspace
        # The Docker image copies apps/api alone, so the module must build with
        # no go.work to fall back on. Catching that here fails in seconds
        # rather than several minutes into the image build.
        run: GOWORK=off go build ./...
        working-directory: apps/api
      - name: gofmt
        run: |
          unformatted="$(gofmt -l apps/api)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

  api-tests:
    name: API tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # internal/api is most of the suite (~1,350 tests, minutes under -race
        # on a 2-core runner), so it is split by test-name hash across three
        # jobs (scripts/test-shard.sh) and everything else runs in its own.
        # Each job gets its own PostgreSQL service container, so shards do not
        # share a database at all; within a job every test also has a schema of
        # its own (internal/pgtest), which is what lets packages run in parallel.
        include:
          - name: rest
          - name: api 1/3
            shard: 1
          - name: api 2/3
            shard: 2
          - name: api 3/3
            shard: 3
    services:
      # PostgreSQL is what this runs against in the cluster. SQLite passing
      # says nothing about it: placeholders, booleans and blob types all
      # differ, so the database tests run against both here.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: domestique
          POSTGRES_DB: domestique_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOMESTIQUE_TEST_POSTGRES: postgres://postgres:domestique@localhost:5432/domestique_test?sslmode=disable
      # A missing database fails the test instead of skipping it, in every
      # package (internal/pgtest), so no engine can silently go uncovered.
      DOMESTIQUE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go mod download
        working-directory: apps/api
      - name: Tests
        # -timeout: a shard of internal/api is minutes under -race, so go
        # test's 10-minute default is too close; a test that hangs still fails.
        # Packages run in parallel: each test owns a PostgreSQL schema
        # (internal/pgtest) and a SQLite file, so they share nothing. The
        # old `-p 1` is gone.
        # -cover prints a coverage figure per package; the three api shards
        # each report only their share of internal/api, and nothing merges
        # them (no coverage profile is consumed anywhere).
        working-directory: apps/api
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            run="$(../../scripts/test-shard.sh ${{ matrix.shard }} 3)"
            go test ./internal/api -count=1 -race -cover -timeout 25m -run "$run"
          else
            go test $(go list ./... | grep -v '/internal/api$') -count=1 -race -cover -timeout 25m
          fi
      - name: Fail if the PostgreSQL tests were skipped
        # A silently skipped engine is worse than no test: it reads green while
        # covering nothing. DOMESTIQUE_REQUIRE_POSTGRES already turns a missing
        # server into a failure; this checks the tests really ran against it.
        if: ${{ !matrix.shard }}
        working-directory: apps/api
        run: |
          if go test ./internal/source/ -run TestEachEngine -v 2>&1 | grep -q "SKIP.*postgres"; then
            echo "::error::the PostgreSQL tests skipped — the service container is not reachable"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm --workspace @domestique/web test
      - run: npm run build
      - name: Fail if the build produced nothing
        run: test -f apps/web/dist/index.html

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: domestique:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image is useless if the binary cannot start, and a missing web
      # bundle only shows up at runtime.
      - name: Smoke test the image
        run: |
          docker run --rm domestique:ci --help | grep -q "fetch-and-carry"
          docker run --rm --entrypoint sh domestique:ci -c 'test -f /app/web/index.html'

      # Run it the way a deployment does — no arguments, so the image's own
      # default command is what gets tested. Checking `--help` is not enough:
      # a stale flag in CMD passes that check and still fails to boot.
      - name: Start the image with its default command
        run: |
          docker run -d --name smoke -p 8080:8080 domestique:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              curl -fsS http://localhost:8080/ | grep -qi domestique
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy:"
          docker logs smoke
          exit 1
