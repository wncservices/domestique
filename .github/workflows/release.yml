name: Release

# Tagging `v<x.y.z>` releases the *application*: this workflow cuts the GitHub
# Release with binaries, and `image.yml` publishes the matching container image
# in parallel off the same tag. The Helm chart is deliberately not part of it —
# it lives in its own repo (wncservices/domestique-chart) and releases on its
# own schedule entirely, from that repo's own workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  binaries:
    name: Publish binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The binary serves the frontend from disk, so ship them together.
      - run: npm ci
      - run: npm run build

      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/domestique_${version}_${os}_${arch}"
            mkdir -p "$out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "$out/domestique" ./apps/api/cmd/domestique
            cp -r apps/web/dist "$out/web"
            cp README.md LICENSE domestique.example.yaml "$out/"
            tar -czf "${out}.tar.gz" -C dist "$(basename "$out")"
            rm -rf "$out"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
