# Everything needed to run and test Domestique locally, so the only thing you
# have to install is Docker.
#
# `db` and `app` are the running application. `go` and `node` are toolchain
# containers behind the `tools` profile, so they never start with `up` — they
# exist so `just test` and `just build` can run without a local Go or Node.

name: domestique

services:
  db:
    # Same major as the cluster, so local and deployed disagree as little as
    # possible.
    image: postgres:17
    environment:
      POSTGRES_USER: domestique
      POSTGRES_PASSWORD: domestique
      POSTGRES_DB: domestique
    ports:
      # Not 5432: that is usually already taken by something else.
      - "15432:5432"
    volumes:
      - db:/var/lib/postgresql/data
      # Creates the separate database the test suite uses. Runs once, when the
      # volume is first initialised.
      - ./docker/postgres-init.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domestique -d domestique"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        VERSION: local
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The point of running against PostgreSQL locally: it is what a
      # deployment uses, and the two engines do differ.
      DOMESTIQUE_SOURCE_DSN: postgres://domestique:domestique@db:5432/domestique?sslmode=disable
      # Komoot is enabled in docker/domestique.yaml, so the panel is there to
      # test. It needs these two; put them in a .env file next to this one
      # (gitignored) and they are picked up automatically. Without them the
      # panel appears and says it cannot sign in, which is the honest state.
      KOMOOT_EMAIL: ${KOMOOT_EMAIL:-}
      KOMOOT_PASSWORD: ${KOMOOT_PASSWORD:-}
      # Garmin sign-in needs the OAuth1 consumer pair Connect's own clients
      # use. Deliberately not in this repository — see internal/garmin/oauth1.go
      # — so without them the Settings page says the sign-in is unavailable
      # rather than offering a form that cannot work. Same .env file.
      GARMIN_OAUTH_CONSUMER_KEY: ${GARMIN_OAUTH_CONSUMER_KEY:-}
      GARMIN_OAUTH_CONSUMER_SECRET: ${GARMIN_OAUTH_CONSUMER_SECRET:-}
      # Encrypts stored Komoot sessions. This one is a throwaway for local use
      # and is committed on purpose — it protects nothing real, and generating
      # a fresh one per `up` would invalidate yesterday's connection. A
      # deployment sets its own: `domestique keygen`, then Vault.
      DOMESTIQUE_ENCRYPTION_KEY: ${DOMESTIQUE_ENCRYPTION_KEY:-ZG9tZXN0aXF1ZS1sb2NhbC1kZXYta2V5LTMyYnl0ZXM=}
      # The apex serves the logged-out page; everything else serves the app.
      # Locally: http://domestique.localhost:8080 vs http://localhost:8080
      DOMESTIQUE_LANDING_HOST: domestique.localhost
    volumes:
      # The image ships no config; this is what turns Komoot on locally.
      - ./docker/domestique.yaml:/app/domestique.yaml:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # Without this, `up --wait` returns as soon as the process starts, which
      # is well before it has migrated the database and can answer.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # --- toolchain containers (profile: tools) ---

  go:
    profiles: [tools]
    image: golang:1.26.6-alpine
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The Go suite skips its PostgreSQL cases unless this is set, and a skip
      # looks exactly like a pass. It points at a *separate* database: the
      # tests drop their tables, and the app's routes live next door.
      DOMESTIQUE_TEST_POSTGRES: postgres://domestique:domestique@db:5432/domestique_test?sslmode=disable
      GOFLAGS: -buildvcs=false
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
    volumes:
      - .:/src
      - gocache:/cache

  node:
    profiles: [tools]
    image: node:24.19.0-alpine
    working_dir: /src
    volumes:
      - .:/src
      # node_modules stays in the container: the host may be a different
      # platform, and native binaries do not survive the trip.
      - nodemodules:/src/node_modules

volumes:
  db:
  gocache:
  nodemodules:
